<div class="content">
  <div class="title">
    <h2>Web projects library</h2>
    <p>
      Here are some things I've published on the web so far. More manual things like music or 3d printing are on my
      instagram:
      <a
        href="https://www.instagram.com/bart_robat/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Visit Bart Robat's Instagram profile"
        >here</a
      >.
    </p>
  </div>

  <div class="blocks">
    @for (project of projects$ | async; track project.id) {
      <div class="image-container">
        <article
          class="tile"
          [routerLink]="project.route"
          role="button"
          tabindex="0"
          [attr.aria-label]="'Navigate to ' + project.title + ' project'"
        >
          <div>
            <h5>
              {{ project.title }}
            </h5>
            <p>
              {{ project.description }}
            </p>
          </div>
          <img [src]="project.imagePath" [alt]="project.imageAlt" loading="lazy" />
        </article>
      </div>
    }
  </div>
</div>

<footer class="footer" role="contentinfo"></footer>
