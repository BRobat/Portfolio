<a class="back-button glass rim" routerLink="/news" aria-label="Back to all news">← back</a>

<article class="content">
  <header class="title">
    <h1>{{ post().title }}</h1>
    <time [attr.datetime]="post().date">{{ post().date }}</time>
  </header>

  <app-markdown-content [html]="entry().html" />

  <footer class="meta">
    @if (projects().length) {
      <p>
        Related:
        @for (project of projects(); track project.slug; let last = $last) {
          <a [routerLink]="['/projects', project.slug]">{{ project.title }}</a>@if (!last) {, }
        }
      </p>
    }
    <p class="back"><a class="pill" routerLink="/news">← all news</a></p>
  </footer>
</article>
