<nav class="bar glass rim" aria-label="Main">
  @for (link of links; track link.path) {
    <a
      class="link"
      [routerLink]="link.path"
      routerLinkActive
      #rla="routerLinkActive"
      [class.active]="rla.isActive || (link.path === '/projects' && atRoot())"
      [attr.aria-current]="rla.isActive || (link.path === '/projects' && atRoot()) ? 'page' : null"
      >{{ link.label }}</a
    >
  }
</nav>
