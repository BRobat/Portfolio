<nav class="bar glass rim" aria-label="Main">
  @for (link of links; track link.path) {
    <a
      class="link"
      [routerLink]="link.path"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [class.active]="link.path === '/projects' && atRoot()"
      >{{ link.label }}</a
    >
  }
</nav>
