@if (showNavbar) {

        </div>
        <a class="button" routerLink="/projects" routerLinkActive="button-activated">
            Projects
        </a>

        <a class="button" routerLink="/news" routerLinkActive="button-activated">
            News
        </a>

        <a class="button" routerLink="/about" routerLinkActive="button-activated">

        </a>
